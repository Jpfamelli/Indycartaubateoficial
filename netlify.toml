[build]
  publish = "."

# Segurança (rodada 3, 13/10/2026). O deploy é `npm run publicar` (pasta dist/);
# o netlify-cli lê estes cabeçalhos daqui mesmo assim. O teste (`npm test`) aplica
# os MESMOS cabeçalhos no servidor local, então uma CSP que quebre algo falha o teste.
#
# CSP: script só daqui (sem script embutido nem onload/onerror no HTML);
# estilos daqui ('unsafe-inline' só para estilo: 404 e privacidade
# têm <style> próprio e o script mexe em style); fontes do próprio site (rodada 4); mapa do Google
# só em iframe (frame-src); o formulário abre o wa.me por window.open (fora da CSP).
# connect-src (rodada 5): o formulário grava o pedido na Edge Function site-lead do Supabase da oficina.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://nppfqhavqahapmugnyng.supabase.co; frame-src https://maps.google.com https://www.google.com; manifest-src 'self'; form-action 'self' https://wa.me; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), browsing-topics=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cache-Control = "public, max-age=0, must-revalidate"

# Manifesto com o tipo certo (a Netlify servia como octet-stream).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Fontes do próprio site (rodada 4): o nome muda se a fonte mudar.
[[headers]]
  for = "/fontes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS e JS (rodada 5): o `npm run publicar` põe ?v=<hash do conteúdo> nos links do HTML, então o arquivo pode
# ficar em cache por um ano — mudou o conteúdo, muda o endereço e o navegador baixa o novo.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "https://www.indycar-taubate.netlify.app/*"
  to = "https://indycar-taubate.netlify.app/:splat"
  status = 301
  force = true

# Atalhos curtos (rodada 5): dá para falar e escrever no anúncio ou no balcão.
# Área do Cliente (sistema Pátio): acompanhar o carro na oficina e a área "Minha IndyCar".
[[redirects]]
  from = "/acompanhar"
  to = "https://indycar-patio.netlify.app/acompanhar/"
  status = 302

[[redirects]]
  from = "/acompanhar/*"
  to = "https://indycar-patio.netlify.app/acompanhar/:splat"
  status = 302

[[redirects]]
  from = "/minha"
  to = "https://indycar-patio.netlify.app/minha/"
  status = 302

[[redirects]]
  from = "/minha/*"
  to = "https://indycar-patio.netlify.app/minha/:splat"
  status = 302

[[redirects]]
  from = "/area-cliente"
  to = "/#area-cliente"
  status = 302

[[redirects]]
  from = "/whatsapp"
  to = "https://wa.me/5512996830272?text=Ol%C3%A1!%20Vim%20pelo%20site%2C%20quero%20or%C3%A7ar%3A%20Diagn%C3%B3stico%20digital%20gratuito.%20(site%2Fatalho)&utm_source=site&utm_medium=whatsapp&utm_campaign=atalho"
  status = 302

# Rodada 7: o destino fica SEM "?" — a Netlify só repassa a query string (utm_*, gclid, fbclid) quando o destino não
# tem query própria. Por isso os atalhos que abrem o formulário usam o fragmento #agendar[-serviço], que o script.js entende.
[[redirects]]
  from = "/agendar"
  to = "/#agendar"
  status = 302

[[redirects]]
  from = "/servicos"
  to = "/#servicos"
  status = 302

[[redirects]]
  from = "/contato"
  to = "/#contato"
  status = 302

[[redirects]]
  from = "/privacidade"
  to = "/privacidade.html"
  status = 301

# Rodada 6: atalhos para o Atendimento, o Comunicar e os anúncios mandarem a pessoa direto ao ponto.
# /s/freios abre o formulário já com o serviço (os códigos são os de #svc-<código>); /orcamento e /horarios idem.
[[redirects]]
  from = "/s/:servico"
  to = "/#agendar-:servico"
  status = 302

[[redirects]]
  from = "/orcamento"
  to = "/#agendar-diagnostico"
  status = 302

[[redirects]]
  from = "/horarios"
  to = "/#horarios"
  status = 302

[[redirects]]
  from = "/minha-indycar"
  to = "https://indycar-patio.netlify.app/minha/"
  status = 302

[[redirects]]
  from = "/indicar"
  to = "https://indycar-patio.netlify.app/minha/#indique"
  status = 302

# Rodada 6: o navegador já começa a baixar CSS e as duas fontes da primeira dobra com a resposta do HTML (dicas de pré-carregamento).
[[headers]]
  for = "/"
  [headers.values]
    Link = "</fontes/archivo-variavel.woff2>; rel=preload; as=font; type=font/woff2; crossorigin, </fontes/inter-variavel.woff2>; rel=preload; as=font; type=font/woff2; crossorigin"

# Rodada 7: links curtos no domínio da oficina para o Pátio, o Orçador e o Atendimento mandarem no WhatsApp
# (mais curtos e com a cara da IndyCar). /a/<código> = Acompanhar meu carro; /m/<código> = Minha IndyCar; /o/<código> = orçamento.
[[redirects]]
  from = "/a/:token"
  to = "https://indycar-patio.netlify.app/acompanhar/?t=:token"
  status = 302

[[redirects]]
  from = "/m/:token"
  to = "https://indycar-patio.netlify.app/minha/?c=:token"
  status = 302

[[redirects]]
  from = "/o/:token"
  to = "https://indycar-orcador.netlify.app/#/o/:token"
  status = 302

# Como chegar (para o Atendimento mandar a rota pronta no Google Maps)
[[redirects]]
  from = "/rota"
  to = "https://www.google.com/maps/dir/?api=1&destination=Av.+Bandeirantes%2C+875+-+Parque+Paduan%2C+Taubat%C3%A9+-+SP"
  status = 302

# Rodada 7: mais atalhos para o Atendimento mandar (todos repassam utm_*): /s sozinho abre o formulário.
[[redirects]]
  from = "/s"
  to = "/#agendar"
  status = 302

[[redirects]]
  from = "/garantia"
  to = "/#garantia"
  status = 302

[[redirects]]
  from = "/diagnostico"
  to = "/#diagnostico"
  status = 302

[[redirects]]
  from = "/duvidas"
  to = "/#faq"
  status = 302
