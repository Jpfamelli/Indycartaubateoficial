[build]
  publish = "."

# Segurança (rodada 3, 13/10/2026). O deploy é `npm run publicar` (pasta dist/);
# o netlify-cli lê estes cabeçalhos daqui mesmo assim. O teste (`npm test`) aplica
# os MESMOS cabeçalhos no servidor local, então uma CSP que quebre algo falha o teste.
#
# CSP: script só daqui (sem script embutido nem onload/onerror no HTML);
# estilos daqui + Google Fonts ('unsafe-inline' só para estilo: 404 e privacidade
# têm <style> próprio e o script mexe em style); fontes do gstatic; mapa do Google
# só em iframe (frame-src); o formulário abre o wa.me por window.open (fora da CSP).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://maps.google.com https://www.google.com; manifest-src 'self'; form-action 'self' https://wa.me; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), browsing-topics=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "https://www.indycar-taubate.netlify.app/*"
  to = "https://indycar-taubate.netlify.app/:splat"
  status = 301
  force = true
